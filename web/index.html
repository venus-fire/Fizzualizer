<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fizzualizer</title>
<!-- Without this the browser asks for /favicon.ico on the domain root, which is
     Immich's icon. favicon.svg is served by the home-gateway route from
     icons/fizzualizer.svg, so the app icon stays the single source; the PNG is
     the same file for browsers that will not take an SVG icon. -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" sizes="256x256" type="image/png">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #c8c8d0;
  }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

  #bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    gap: .5rem;
    align-items: center;
    padding: .6rem .75rem;
    font-size: .72rem;
    letter-spacing: .02em;
    opacity: .35;
    transition: opacity .2s ease;
  }
  #bar:hover, #bar:focus-within, body.veiled #bar { opacity: 1; }
  body.veiled #bar { background: linear-gradient(#000000cc, #00000000); }

  button {
    font: inherit;
    color: #d6d6e0;
    background: #14141a;
    border: 1px solid #2a2a34;
    border-radius: 999px;
    padding: .3rem .7rem;
    cursor: pointer;
  }
  button:hover { background: #1d1d26; border-color: #3a3a48; }
  button.on { background: #2a2440; border-color: #4a3f6e; color: #e2dcf2; }

  #status {
    margin-left: auto;
    opacity: .8;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 40vw;
  }

  #panel {
    position: fixed;
    top: 2.6rem; right: .75rem;
    width: min(22rem, 88vw);
    max-height: 78vh;
    overflow-y: auto;
    padding: .8rem .9rem 1rem;
    background: rgba(12, 12, 16, .86);
    border: 1px solid #26263a;
    border-radius: .6rem;
    backdrop-filter: blur(6px);
    font-size: .72rem;
    display: none;
  }
  #panel.open { display: block; }
  #panel h2 {
    font-size: .68rem;
    text-transform: uppercase;
    letter-spacing: .12em;
    opacity: .55;
    margin: .9rem 0 .5rem;
    font-weight: 500;
  }
  #panel h2:first-child { margin-top: 0; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: .1rem .5rem; margin-bottom: .45rem; }
  .row label { opacity: .8; }
  .row output { font-variant-numeric: tabular-nums; opacity: .6; }
  .row input[type=range] {
    grid-column: 1 / -1;
    width: 100%;
    accent-color: #8a6fd6;
    height: 1rem;
  }
  #panel .actions { display: flex; gap: .5rem; margin-top: .8rem; }
  #panel .note { opacity: .45; line-height: 1.5; margin: .6rem 0 0; }

  #hint {
    position: fixed;
    bottom: 1rem; left: 0; right: 0;
    text-align: center;
    font-size: .7rem;
    opacity: .3;
    pointer-events: none;
    transition: opacity .6s ease;
  }
  #hint.gone { opacity: 0; }

  #drop {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    background: #000000cc;
    border: 2px dashed #4a3f6e;
    font-size: .9rem;
    color: #cfc6ea;
  }
  #drop.active { display: grid; }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="bar">
  <button id="btn-file">Load audio</button>
  <button id="btn-share">Share audio</button>
  <button id="btn-mic">Microphone</button>
  <button id="btn-settings">Settings</button>
  <button id="btn-full">Fullscreen</button>
  <span id="status">no audio</span>
</div>

<div id="panel" aria-label="Settings">
  <h2>Audio</h2>
  <div id="sliders-audio"></div>
  <h2>Motion</h2>
  <div id="sliders-motion"></div>
  <div class="actions">
    <button id="btn-reset">Reset defaults</button>
    <button id="btn-close">Close</button>
  </div>
  <p class="note">Sliders are saved in this browser. The desktop build keeps
  its defaults in config.py; this page keeps its own copy in config.js.</p>
</div>

<div id="drop">Drop an audio file</div>
<div id="hint">Drop an audio file anywhere. F for fullscreen, H for settings.</div>

<input id="file" type="file" accept="audio/*" hidden>
<script type="module" src="main.js"></script>
</body>
</html>
